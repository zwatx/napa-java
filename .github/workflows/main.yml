name: CMake

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch-name: linuxx86-64
          - os: ubuntu-24.04-arm
            arch-name: linuxarm64
          - os: windows-latest
            arch-name: windowsx86-64
            extra-flags: -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER=clang-cl
          - os: macos-latest
            arch-name: osxuniversal
            extra-flags: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

    runs-on: ${{ matrix.os }}
    name: "napa-jni - Build - ${{ matrix.arch-name }}"
    env:
      # Publishing needs PhotonVision's Maven key; without it, CI only builds and tests
      ARTIFACTORY_API_KEY: ${{ secrets.ARTIFACTORY_API_KEY }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'
        fetch-depth: 0

    - name: Fetch tags
      run: git fetch --tags --force
    - run: git describe --tags --always

    - uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: temurin

    - name: Install deps (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt-get install -y cmake ninja-build gcc g++

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/cmake_build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{ matrix.extra-flags }}

    - name: Build napa_jni
      shell: bash
      run: cmake --build "${{ github.workspace }}/cmake_build" --target napa_jni

    - name: Gradle build
      # Also runs the tests, which load the library just built
      run: ./gradlew build

    - run: ./gradlew publish
      name: Publish
      if: env.ARTIFACTORY_API_KEY != '' && github.event_name == 'push'

    - uses: actions/upload-artifact@v7
      with:
        name: libnapa-jar-${{ matrix.arch-name }}
        path: ${{ github.workspace }}/build/libs/*.jar
